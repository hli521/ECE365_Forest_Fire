 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
build_src_filter = -<*> +<device.cpp>

; Force serial monitoring output to show correctly
monitor_speed = 115200

; Required libraries for display and radio functionality
lib_deps =
    https://github.com/Sensirion/arduino-i2c-svm4x.git#101de1b23dd675867c73a423432f17b198064aea
    sensirion/Sensirion Core @ ^0.7.1
    adafruit/Adafruit PM25 AQI Sensor @ ^2.0.0
    adafruit/Adafruit MLX90614 Library @ ^2.1.5
    ropg/Heltec_ESP32_LoRa_v3 @ ^0.9.2
    jgromes/RadioLib @ ^7.1.2
    https://github.com/sparkfun/SparkFun_GridEYE_Arduino_Library.git
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:heltec_lora_server]
extends = env:heltec_wifi_lora_32_V3
build_src_filter = -<*> +<server.cpp>
lib_deps =
    ropg/Heltec_ESP32_LoRa_v3 @ ^0.9.2
    jgromes/RadioLib @ ^7.1.2

[env:heltec_sensor_test]
extends = env:heltec_wifi_lora_32_V3
build_src_filter = -<*> +<device_test.cpp>
lib_deps =
    adafruit/Adafruit MLX90614 Library @ ^2.1.5
    ropg/Heltec_ESP32_LoRa_v3 @ ^0.9.2
    jgromes/RadioLib @ ^7.1.2
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
